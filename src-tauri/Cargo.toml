[package]
name = "dbsage"
version = "0.22.0"
description = "DB Sage Ã¢â‚¬â€ sleek MySQL desktop client"
authors = ["Rob Mirabelle"]
edition = "2021"

[lib]
name = "dbsage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "macros",
    "mysql",
    "sqlite",
    "chrono",
    "bigdecimal",
    "json",
    "uuid",
] }
mysql_async = { version = "0.36", default-features = false, features = ["default-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"

argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"

keyring = { version = "3", features = ["windows-native"] }

zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
rust_xlsxwriter = "0.95.0"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
